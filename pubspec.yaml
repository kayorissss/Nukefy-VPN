name: nukefy_vpn
description: Nukefy VPN — клиент sing-box для VLESS Reality, VMess, Trojan, Shadowsocks, Hysteria2, TUIC, WireGuard и AmneziaWG.
publish_to: "none"
version: 1.0.1+2

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  dio: ^5.7.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.3
  flutter_animate: ^4.5.2
  url_launcher: ^6.3.1
  file_picker: ^13.1.0
  share_plus: ^13.1.0
  permission_handler: ^11.4.0
  mobile_scanner: ^7.0.0
  path_provider: ^2.1.5
  package_info_plus: ^10.2.1
  uuid: ^4.5.1
  crypto: ^3.0.6
  yaml: ^3.1.3
  archive: ^3.6.1
  path: ^1.9.1
  web_socket_channel: ^3.0.1
  window_manager: ^0.5.0
  tray_manager: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/fonts/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
