name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag the builds are attached to'
        required: true
        default: 'v1.0.1'

permissions:
  contents: write
  pull-requests: write

env:
  # Works both for a published release and for a manual re-run of the workflow.
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true
      - name: Resolve packages
        id: pub
        run: |
          set +e
          flutter pub get > pub.txt 2>&1
          code=$?
          cat pub.txt
          exit $code
      - name: Report package error
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo 'Android flutter pub get failed:'
            echo '```'
            tail -n 40 pub.txt
            echo '```'
          } > comment.md
          gh pr comment 1 --body-file comment.md || true
      - name: Build APK
        run: |
          set +e
          flutter build apk --release > build.txt 2>&1
          code=$?
          tail -n 80 build.txt
          exit $code
      - name: Report build error
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo 'Android build failed:'
            echo '```'
            tail -n 60 build.txt
            echo '```'
          } > comment.md
          gh pr comment 1 --body-file comment.md || true
      - run: cp build/app/outputs/flutter-apk/app-release.apk NukefyVPN-android.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: NukefyVPN-android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true
      - run: flutter config --enable-windows-desktop
      - name: Resolve packages
        shell: pwsh
        run: |
          flutter pub get *> pub.txt
          Get-Content pub.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Report package error
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tail = Get-Content pub.txt -Tail 40
          @"
          Windows flutter pub get failed:
          ``````
          $($tail -join "`n")
          ``````
          "@ | Set-Content comment.md
          gh pr comment 1 --body-file comment.md
      - name: Build Windows
        shell: pwsh
        run: |
          flutter build windows --release *> build.txt
          Get-Content build.txt -Tail 80
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Report Windows build error
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tail = Get-Content build.txt -Tail 60
          @"
          Windows build failed:
          ``````
          $($tail -join "`n")
          ``````
          "@ | Set-Content comment.md
          gh pr comment 1 --body-file comment.md
      - name: Zip Windows build
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath NukefyVPN-windows-x64.zip
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: NukefyVPN-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
