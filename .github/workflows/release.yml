name: Release

on:
  # The job-level marker below is intentional: it provides a one-shot release
  # build from this fixed branch when workflow dispatch is unavailable.
  push: {}
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag the built files belong to'
        required: false
        default: v2.5.7

permissions:
  contents: write
  pull-requests: write

env:
  # Tag to attach the files to: the tag of the published release, the input
  # from a manual run, or the current tag. The fallback keeps the existing
  # release-build escape hatch usable from this maintenance branch.
  RELEASE_TAG: ${{ github.event.inputs.tag || github.event.release.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v1.0.0' }}
  # sing-box line used for the embedded Android core (libbox). Keep it on the
  # 1.12 branch: 1.13+ replaced `Libbox.newService` with a gRPC command server.
  SINGBOX_VERSION: v1.12.25

jobs:
  libbox:
    if: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[release-build]') }}
    name: sing-box libbox (Android core)
    runs-on: ubuntu-latest
    steps:
      - name: Restore cached libbox.aar
        id: cache
        uses: actions/cache@v4
        with:
          path: libbox.aar
          key: libbox-${{ env.SINGBOX_VERSION }}-arm64-arm-v2
      - uses: actions/checkout@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          repository: SagerNet/sing-box
          ref: ${{ env.SINGBOX_VERSION }}
          path: sing-box
      - uses: actions/setup-go@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          go-version: '1.24'
          cache-dependency-path: sing-box/go.sum
      - uses: actions/setup-java@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android NDK
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -e
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.0.13004108" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> "$GITHUB_ENV"
      - name: Build libbox.aar
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: sing-box
        run: |
          set -e
          go install -v github.com/sagernet/gomobile/cmd/gomobile@v0.1.8
          go install -v github.com/sagernet/gomobile/cmd/gobind@v0.1.8
          export PATH="$(go env GOPATH)/bin:$PATH"
          gomobile init
          gomobile bind -v \
            -target android/arm64,android/arm \
            -androidapi 21 \
            -javapkg=io.nekohasekai \
            -libname=box \
            -trimpath -buildvcs=false \
            -ldflags "-X github.com/sagernet/sing-box/constant.Version=${SINGBOX_VERSION#v} -s -w -buildid= -checklinkname=0" \
            -tags with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,with_conntrack \
            ./experimental/libbox
          ls -la libbox.aar
          cp libbox.aar ../libbox.aar
      - uses: actions/upload-artifact@v4
        with:
          name: libbox
          path: libbox.aar
          if-no-files-found: error

  android:
    if: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[release-build]') }}
    name: Android APK
    runs-on: ubuntu-latest
    env:
      HAS_ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    needs: libbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: libbox
          path: android/app/libs
      - run: ls -la android/app/libs
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true
      - name: Configure persistent Android signing key
        if: env.HAS_ANDROID_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nukefy-release.jks"
      - name: Resolve packages
        run: flutter pub get
      - name: Build APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && format('{0}/nukefy-release.jks', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release
      - name: Verify APK identity and signature
        run: |
          set -e
          APK=build/app/outputs/flutter-apk/app-release.apk
          "$ANDROID_HOME/build-tools/$(ls -1 "$ANDROID_HOME/build-tools" | tail -1)/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest application-id "$APK" | grep -Fx 'com.nukefy.vpn'
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest version-code "$APK" | grep -Fx '24'
      - run: cp build/app/outputs/flutter-apk/app-release.apk NukefyClient-${{ env.RELEASE_TAG }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NukefyClient-android
          path: NukefyClient-*.apk
          if-no-files-found: error

  windows:
    if: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[release-build]') }}
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true
      - run: flutter config --enable-windows-desktop
      - name: Resolve packages
        shell: pwsh
        run: flutter pub get
      - name: Build Windows
        shell: pwsh
        run: flutter build windows --release
      - name: Bundle zapret (Flowseal/zapret-discord-youtube)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path zapret-src | Out-Null
          gh release download -R Flowseal/zapret-discord-youtube --pattern '*.zip' --dir zapret-src
          $zip = Get-ChildItem zapret-src -Filter *.zip | Select-Object -First 1
          Expand-Archive -Path $zip.FullName -DestinationPath zapret-src/unpacked -Force
          $root = Get-ChildItem zapret-src/unpacked -Directory -Recurse | Where-Object { Test-Path (Join-Path $_.FullName 'bin/winws.exe') } | Select-Object -First 1
          if (-not $root) { if (Test-Path 'zapret-src/unpacked/bin/winws.exe') { $root = Get-Item 'zapret-src/unpacked' } else { throw 'winws.exe not found in zapret archive' } }
          $dest = 'build/windows/x64/runner/Release/zapret'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -Recurse -Force (Join-Path $root.FullName 'bin') $dest
          Copy-Item -Recurse -Force (Join-Path $root.FullName 'lists') $dest
          Get-ChildItem $root.FullName -Filter 'general*.bat' | Copy-Item -Destination $dest -Force
          Copy-Item -Force (Join-Path $root.FullName 'service.bat') $dest
          Copy-Item -Recurse -Force (Join-Path $root.FullName 'utils') $dest
          $zip.Name | Out-File -Encoding utf8 -FilePath (Join-Path $dest 'VERSION.txt')
          Get-ChildItem $dest
      - name: Bundle sing-box and Xray cores
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $rel = 'build/windows/x64/runner/Release'
          New-Item -ItemType Directory -Force -Path "$rel/core" | Out-Null
          New-Item -ItemType Directory -Force -Path "$rel/xray" | Out-Null
          # Official sing-box CLI build (same asset the in-app downloader picks).
          New-Item -ItemType Directory -Force -Path sbx | Out-Null
          gh release download -R SagerNet/sing-box --pattern '*windows-amd64.zip' --dir sbx
          $zip = Get-ChildItem sbx -Filter *.zip | Select-Object -First 1
          if (-not $zip) { throw 'sing-box windows archive not downloaded' }
          Expand-Archive -Path $zip.FullName -DestinationPath sbx/out -Force
          $exe = Get-ChildItem sbx/out -Recurse -Filter 'sing-box.exe' | Select-Object -First 1
          if (-not $exe) { throw 'sing-box.exe not found in archive' }
          Copy-Item $exe.FullName "$rel/core/sing-box.exe" -Force
          # Xray core (same asset the in-app downloader picks).
          New-Item -ItemType Directory -Force -Path xray-src | Out-Null
          gh release download -R XTLS/Xray-core --pattern 'Xray-windows-64.zip' --dir xray-src
          $xzip = Get-ChildItem xray-src -Filter *.zip | Select-Object -First 1
          if (-not $xzip) { throw 'Xray windows archive not downloaded' }
          Expand-Archive -Path $xzip.FullName -DestinationPath xray-src/out -Force
          $xexe = Get-ChildItem xray-src/out -Recurse -Filter 'xray.exe' | Select-Object -First 1
          if (-not $xexe) { throw 'xray.exe not found in archive' }
          Copy-Item $xexe.FullName "$rel/xray/xray.exe" -Force
          Get-ChildItem "$rel/core", "$rel/xray" | Format-Table Name, Length
          Write-Host 'bundled cores:'
          Get-ChildItem "$rel/core", "$rel/xray" | ForEach-Object { "{0} {1:N0} bytes" -f $_.Name, $_.Length }

      - name: Build portable single exe
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = "${{ env.RELEASE_TAG }}".TrimStart('v')
          if ($ver -notmatch '^\d+\.\d+\.\d+$') { $ver = '0.0.0' }
          $log = @()
          try {
            Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath payload.zip -CompressionLevel Optimal -ErrorAction Stop
            $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
            $log += "csc: $csc exists=$(Test-Path $csc)"
            $lines = @(
              'using System.Reflection;',
              '[assembly: AssemblyTitle("Nukefy Client")]',
              '[assembly: AssemblyProduct("Nukefy Client")]',
              '[assembly: AssemblyCompany("@kayorisan")]',
              "[assembly: AssemblyVersion(`"$ver.0`")]",
              "[assembly: AssemblyFileVersion(`"$ver.0`")]"
            )
            Set-Content -Path AssemblyInfo.cs -Value $lines
            $portable = "NukefyClient-$ver-Portable-x64.exe"
            $out = & $csc /nologo /target:winexe /platform:anycpu /optimize+ /out:$portable `
              /win32icon:windows\runner\resources\app_icon.ico `
              /win32manifest:windows\portable\launcher.manifest `
              /resource:payload.zip,payload.zip `
              /reference:System.IO.Compression.dll /reference:System.IO.Compression.FileSystem.dll /reference:System.Windows.Forms.dll `
              windows\portable\Launcher.cs AssemblyInfo.cs 2>&1
            $log += $out
            if ($LASTEXITCODE -ne 0) { throw "csc exit $LASTEXITCODE" }
            if (-not (Test-Path $portable)) { throw "$portable not produced" }
            Get-Item $portable | Format-List Name,Length
          } catch {
            $log += "ERROR: $_"
            $fence = '```'
            $body = "Portable exe build failed:`n`n$fence`n" + ($log -join "`n") + "`n$fence"
            gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -f body="$body" | Out-Null
            throw
          }
      - name: Build branded installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = "${{ env.RELEASE_TAG }}".TrimStart('v')
          if ($ver -notmatch '^\d+\.\d+\.\d+$') { $ver = '0.0.0' }
          $log = @()
          try {
            if (-not (Test-Path payload.zip)) { throw 'payload.zip missing (portable step failed)' }
            $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
            $setup = "NukefyClient-$ver-Setup-x64.exe"
            Copy-Item windows\runner\resources\app_icon.ico installer_icon.ico -Force
            $out = & $csc /nologo /target:winexe /platform:anycpu /optimize+ /out:$setup `
              /win32icon:installer_icon.ico `
              /win32manifest:windows\installer\setup.manifest `
              /resource:payload.zip,payload.zip `
              /resource:installer_icon.ico,app_icon.ico `
              /reference:System.IO.Compression.dll /reference:System.IO.Compression.FileSystem.dll `
              /reference:System.Windows.Forms.dll /reference:System.Drawing.dll `
              /reference:System.Core.dll `
              windows\installer\NukefyInstaller.cs AssemblyInfo.cs 2>&1
            $log += $out
            if ($LASTEXITCODE -ne 0) { throw "csc exit $LASTEXITCODE" }
            if (-not (Test-Path $setup)) { throw "$setup not produced" }
            Get-Item $setup | Format-List Name,Length
          } catch {
            $log += "ERROR: $_"
            $fence = '```'
            $body = "Installer build failed:`n`n$fence`n" + ($log -join "`n") + "`n$fence"
            gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -f body="$body" | Out-Null
            throw
          }
      - name: Sign Windows files when a certificate is configured
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_PFX_BASE64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_PFX_PASSWORD)) {
            Write-Host 'No Authenticode certificate configured; release remains verifiable by SHA-256.'
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'nukefy-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
          $files = Get-ChildItem 'NukefyClient-*.exe' | ForEach-Object FullName
          $files += Get-ChildItem 'build/windows/x64/runner/Release' -Recurse -Filter '*.exe' | ForEach-Object FullName
          $signtool = (Get-Command signtool.exe -ErrorAction Stop).Source
          foreach ($file in ($files | Select-Object -Unique)) {
            & $signtool sign /quiet /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $pfx /p $env:WINDOWS_PFX_PASSWORD $file
            if ($LASTEXITCODE -ne 0) { throw "signtool failed for $file" }
          }
          Remove-Item $pfx -Force
      - uses: actions/upload-artifact@v4
        with:
          name: NukefyClient-windows-x64
          path: |
            NukefyClient-*-Setup-x64.exe
            NukefyClient-*-Portable-x64.exe
          if-no-files-found: error

  publish:
    if: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[release-build]') }}
    name: Publish complete release
    runs-on: ubuntu-latest
    needs: [android, windows]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: NukefyClient-*
          merge-multiple: true
          path: release-assets
      - name: Name the Android build after its version
        working-directory: release-assets
        run: |
          set -e
          ver="${RELEASE_TAG#v}"
          # One file per platform, version in the name: no "(1)", "(2)" when
          # the same file is downloaded twice.
          mv "NukefyClient-${RELEASE_TAG}.apk" "NukefyClient-${ver}.apk" 2>/dev/null || true
      - name: Create release checksums
        working-directory: release-assets
        run: |
          set -e
          # SHA256SUMS.txt is a checksum list: every file here has a line with
          # its hash, so a downloaded file can be verified as untampered.
          sha256sum * > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt
      - name: Compose release notes
        run: |
          set -e
          ver="${RELEASE_TAG#v}"
          sed "s/__VERSION__/${ver}/g" tool/release_notes.md > RELEASE_NOTES.md
          cat RELEASE_NOTES.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Nukefy Client ${{ env.RELEASE_TAG }}
          # Hand-written notes, no "Full Changelog" appendix.
          body_path: RELEASE_NOTES.md
          files: |
            release-assets/*
            SHA256SUMS.txt
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
