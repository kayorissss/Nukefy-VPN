name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true
      - name: Resolve packages
        id: pub
        run: |
          set +e
          flutter --version > pub.txt
          flutter pub get -v >> pub.txt 2>&1
          code=$?
          tail -n 60 pub.txt
          exit $code
      - name: Report package error
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo 'Android flutter pub get failed:'
            echo '```'
            tail -n 80 pub.txt
            echo '```'
          } > comment.md
          gh pr comment 1 --body-file comment.md || true
      - run: flutter build apk --release
      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk NukefyVPN-android.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          files: NukefyVPN-android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true
      - run: flutter config --enable-windows-desktop
      - name: Resolve packages
        id: pub
        shell: pwsh
        run: |
          flutter --version *> pub.txt
          flutter pub get -v *>> pub.txt
          if ($LASTEXITCODE -ne 0) { Get-Content pub.txt -Tail 60; exit $LASTEXITCODE }
      - name: Report package error
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tail = Get-Content pub.txt -Tail 80
          @"
          Windows flutter pub get failed:
          ``````
          $($tail -join "`n")
          ``````
          "@ | Set-Content comment.md
          gh pr comment 1 --body-file comment.md
      - run: flutter build windows --release
      - name: Zip Windows build
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath NukefyVPN-windows-x64.zip
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          files: NukefyVPN-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
