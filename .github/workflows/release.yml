name: Release

on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag the built files belong to'
        required: false
        default: v2.5.1

permissions:
  contents: write
  pull-requests: write

env:
  # Tag to attach the files to: the tag of the published release, or the one
  # typed when the workflow is started by hand.
  RELEASE_TAG: ${{ github.event.inputs.tag || github.event.release.tag_name || github.ref_name }}
  # sing-box line used for the embedded Android core (libbox). Keep it on the
  # 1.12 branch: 1.13+ replaced `Libbox.newService` with a gRPC command server.
  SINGBOX_VERSION: v1.12.25

jobs:
  libbox:
    name: sing-box libbox (Android core)
    runs-on: ubuntu-latest
    steps:
      - name: Restore cached libbox.aar
        id: cache
        uses: actions/cache@v4
        with:
          path: libbox.aar
          key: libbox-${{ env.SINGBOX_VERSION }}-arm64-arm-v2
      - uses: actions/checkout@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          repository: SagerNet/sing-box
          ref: ${{ env.SINGBOX_VERSION }}
          path: sing-box
      - uses: actions/setup-go@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          go-version: '1.24'
          cache-dependency-path: sing-box/go.sum
      - uses: actions/setup-java@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android NDK
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -e
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.0.13004108" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> "$GITHUB_ENV"
      - name: Build libbox.aar
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: sing-box
        run: |
          set -e
          go install -v github.com/sagernet/gomobile/cmd/gomobile@v0.1.8
          go install -v github.com/sagernet/gomobile/cmd/gobind@v0.1.8
          export PATH="$(go env GOPATH)/bin:$PATH"
          gomobile init
          gomobile bind -v \
            -target android/arm64,android/arm \
            -androidapi 21 \
            -javapkg=io.nekohasekai \
            -libname=box \
            -trimpath -buildvcs=false \
            -ldflags "-X github.com/sagernet/sing-box/constant.Version=${SINGBOX_VERSION#v} -s -w -buildid= -checklinkname=0" \
            -tags with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,with_conntrack \
            ./experimental/libbox
          ls -la libbox.aar
          cp libbox.aar ../libbox.aar
      - uses: actions/upload-artifact@v4
        with:
          name: libbox
          path: libbox.aar
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: libbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: libbox
          path: android/app/libs
      - run: ls -la android/app/libs
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true
      - name: Resolve packages
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk NukefyVPN-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NukefyVPN-android
          path: NukefyVPN-android.apk
          if-no-files-found: error

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true
      - run: flutter config --enable-windows-desktop
      - name: Resolve packages
        shell: pwsh
        run: flutter pub get
      - name: Build Windows
        shell: pwsh
        run: flutter build windows --release
      - name: Bundle zapret (Flowseal/zapret-discord-youtube)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path zapret-src | Out-Null
          gh release download -R Flowseal/zapret-discord-youtube --pattern '*.zip' --dir zapret-src
          $zip = Get-ChildItem zapret-src -Filter *.zip | Select-Object -First 1
          Expand-Archive -Path $zip.FullName -DestinationPath zapret-src/unpacked -Force
          $root = Get-ChildItem zapret-src/unpacked -Directory -Recurse | Where-Object { Test-Path (Join-Path $_.FullName 'bin/winws.exe') } | Select-Object -First 1
          if (-not $root) { if (Test-Path 'zapret-src/unpacked/bin/winws.exe') { $root = Get-Item 'zapret-src/unpacked' } else { throw 'winws.exe not found in zapret archive' } }
          $dest = 'build/windows/x64/runner/Release/zapret'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -Recurse -Force (Join-Path $root.FullName 'bin') $dest
          Copy-Item -Recurse -Force (Join-Path $root.FullName 'lists') $dest
          Get-ChildItem $root.FullName -Filter 'general*.bat' | Copy-Item -Destination $dest -Force
          Copy-Item -Force (Join-Path $root.FullName 'service.bat') $dest
          Copy-Item -Recurse -Force (Join-Path $root.FullName 'utils') $dest
          $zip.Name | Out-File -Encoding utf8 -FilePath (Join-Path $dest 'VERSION.txt')
          Get-ChildItem $dest
      - name: Build portable single exe
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = "${{ env.RELEASE_TAG }}".TrimStart('v')
          if ($ver -notmatch '^\d+\.\d+\.\d+$') { $ver = '0.0.0' }
          $log = @()
          try {
            Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath payload.zip -CompressionLevel Optimal -ErrorAction Stop
            $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
            $log += "csc: $csc exists=$(Test-Path $csc)"
            $lines = @(
              'using System.Reflection;',
              '[assembly: AssemblyTitle("Nukefy VPN")]',
              '[assembly: AssemblyProduct("Nukefy VPN")]',
              '[assembly: AssemblyCompany("@kayorisan")]',
              "[assembly: AssemblyVersion(`"$ver.0`")]",
              "[assembly: AssemblyFileVersion(`"$ver.0`")]"
            )
            Set-Content -Path AssemblyInfo.cs -Value $lines
            $out = & $csc /nologo /target:winexe /platform:anycpu /optimize+ /out:NukefyVPN.exe `
              /win32icon:windows\runner\resources\app_icon.ico `
              /win32manifest:windows\portable\launcher.manifest `
              /resource:payload.zip,payload.zip `
              /reference:System.IO.Compression.dll /reference:System.IO.Compression.FileSystem.dll /reference:System.Windows.Forms.dll `
              windows\portable\Launcher.cs AssemblyInfo.cs 2>&1
            $log += $out
            if ($LASTEXITCODE -ne 0) { throw "csc exit $LASTEXITCODE" }
            if (-not (Test-Path NukefyVPN.exe)) { throw 'NukefyVPN.exe not produced' }
            Get-Item NukefyVPN.exe | Format-List Name,Length
          } catch {
            $log += "ERROR: $_"
            $fence = '```'
            $body = "Portable exe build failed:`n`n$fence`n" + ($log -join "`n") + "`n$fence"
            gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -f body="$body" | Out-Null
            throw
          }
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = "${{ env.RELEASE_TAG }}".TrimStart('v')
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" windows\installer.iss
          if (-not (Test-Path NukefyVPN-Setup-x64.exe)) { throw 'installer not produced' }
      - name: Sign Windows files when a certificate is configured
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_PFX_BASE64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_PFX_PASSWORD)) {
            Write-Host 'No Authenticode certificate configured; release remains verifiable by SHA-256.'
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'nukefy-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
          $files = @('NukefyVPN.exe', 'NukefyVPN-Setup-x64.exe')
          $files += Get-ChildItem 'build/windows/x64/runner/Release' -Recurse -Filter '*.exe' | ForEach-Object FullName
          $signtool = (Get-Command signtool.exe -ErrorAction Stop).Source
          foreach ($file in ($files | Select-Object -Unique)) {
            & $signtool sign /quiet /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $pfx /p $env:WINDOWS_PFX_PASSWORD $file
            if ($LASTEXITCODE -ne 0) { throw "signtool failed for $file" }
          }
          Remove-Item $pfx -Force
      - uses: actions/upload-artifact@v4
        with:
          name: NukefyVPN-windows-x64
          path: |
            NukefyVPN.exe
            NukefyVPN-Setup-x64.exe
          if-no-files-found: error

  publish:
    name: Publish complete release
    runs-on: ubuntu-latest
    needs: [android, windows]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: NukefyVPN-*
          merge-multiple: true
          path: release-assets
      - name: Create release checksums
        working-directory: release-assets
        run: sha256sum NukefyVPN.exe NukefyVPN-Setup-x64.exe NukefyVPN-android.apk > ../SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Nukefy VPN ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            release-assets/NukefyVPN.exe
            release-assets/NukefyVPN-Setup-x64.exe
            release-assets/NukefyVPN-android.apk
            SHA256SUMS.txt
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
