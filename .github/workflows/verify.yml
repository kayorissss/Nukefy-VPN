name: Verify

on:
  push:
    branches:
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify:
    name: Analyze, test and inspect the release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true
      - name: Analyze and test
        shell: bash
        run: |
          set +e
          flutter pub get > pub.txt 2>&1
          echo "pub get exit: $?" > summary.txt
          flutter analyze > analyze.txt 2>&1
          echo "analyze exit: $?" >> summary.txt
          flutter test > test.txt 2>&1
          echo "test exit: $?" >> summary.txt
      - name: Build the APK from the v1.0.1 tag
        shell: bash
        run: |
          set +e
          git checkout -q "v1.0.1"
          echo "checked out $(git rev-parse HEAD)" >> summary.txt
          grep -m1 '^version:' pubspec.yaml >> summary.txt
          flutter pub get > pub2.txt 2>&1
          flutter build apk --release > build.txt 2>&1
          echo "apk build exit: $?" >> summary.txt
          tail -n 15 build.txt
      - name: Inspect the built APK
        shell: bash
        run: |
          set +e
          rm -rf apk && mkdir apk
          unzip -q build/app/outputs/flutter-apk/app-release.apk -d apk
          python3 - <<'PY' >> summary.txt
          import os, sys
          markers = [
              'NukefyVPN/1.0.1',      # userAgent carries the app version
              'verdictWhitelists',    # new jammers verdicts
              'checkNetwork',
              'jammersHint',
              'russianHosts',
              'otherHosts',
              'allTimeTraffic',       # bigger stats screen
              'sessionTime',
              'speedNow',
              'moveUp',               # subscription reordering
              'moveDown',
              'pasteClipboard',
              'android-arm64',        # strict core asset pattern
              'android-arm.tar.gz',
              'windows-amd64',
              '@kayorisan',
          ]
          gone = ['armv7', 'unsupported-archive-from-installer']
          blobs = []
          for root, _, files in os.walk('apk'):
              for name in files:
                  path = os.path.join(root, name)
                  try:
                      blobs.append((path, open(path, 'rb').read()))
                  except OSError:
                      pass
          print('--- markers found in the APK ---')
          for marker in markers:
              hit = False
              for enc in ('utf-8', 'utf-16-le'):
                  needle = marker.encode(enc)
                  if any(needle in blob for _, blob in blobs):
                      hit = True
                      break
              print(('OK   ' if hit else 'MISS ') + marker)
          print('--- strings that must be gone ---')
          for marker in gone:
              hit = any(marker.encode('utf-8') in blob or marker.encode('utf-16-le') in blob
                        for _, blob in blobs)
              print(('STILL THERE ' if hit else 'gone       ') + marker)
          PY
          cat summary.txt
      - name: Report to issue 8
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## Run $GITHUB_RUN_ID · $GITHUB_REF · $GITHUB_SHA"
            echo '### summary'
            echo '```'
            cat summary.txt
            echo '```'
            echo '### flutter analyze'
            echo '```'
            tail -n 250 analyze.txt
            echo '```'
            echo '### flutter test'
            echo '```'
            tail -n 150 test.txt
            echo '```'
            echo '### apk build tail'
            echo '```'
            tail -n 40 build.txt
            echo '```'
          } > report.md
          gh issue comment 8 --body-file report.md
