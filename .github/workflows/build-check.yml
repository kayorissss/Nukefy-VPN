name: Build check

on:
  push:
    branches: [arena/01a0d977-nukefy-vpn]

permissions:
  contents: write

jobs:
  analyze:
    name: Analyze report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: |
          set +e
          mkdir -p .ci
          { flutter analyze --no-fatal-infos; echo "analyze exit: $?"; } > .ci/analyze.txt 2>&1
          { flutter test; echo "test exit: $?"; } > .ci/test.txt 2>&1
          tail -c 20000 .ci/analyze.txt > .ci/analyze.tail.txt
          tail -c 20000 .ci/test.txt > .ci/test.tail.txt
          rm .ci/analyze.txt .ci/test.txt
          cat .ci/analyze.tail.txt
      - name: Publish report to branch
        run: |
          git config user.name ci-bot
          git config user.email ci-bot@users.noreply.github.com
          git add .ci
          git commit -m "ci: analyze report [skip ci]" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
